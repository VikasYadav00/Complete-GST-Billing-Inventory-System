services:
  # 1. Express Backend Web Service
  - type: web
    name: retailpro-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: retailpro-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # 2. Next.js Frontend Web Service
  - type: web
    name: retailpro-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

databases:
  # 3. Managed PostgreSQL Database
  - name: retailpro-db
    plan: free
    region: oregon
    databaseName: retailpro
    user: retailpro_user
